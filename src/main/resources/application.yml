spring:
  application:
    name: switchyard
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5455}/${POSTGRES_DB:switchyard}
    username: ${POSTGRES_USER:switchyard}
    password: ${POSTGRES_PASSWORD:switchyard_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

switchyard:
  tcp:
    enabled: true
    port: 8583
