spring:
  application:
    name: switchyard
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5455}/${POSTGRES_DB:switchyard}
    username: ${POSTGRES_USER:switchyard}
    password: ${POSTGRES_PASSWORD:switchyard_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      # Short timeouts so a down/unreachable Redis fails fast rather than blocking a request for
      # a long default - IdempotencyService is designed to degrade gracefully when this happens,
      # not to hang the pipeline waiting on a connection that isn't coming.
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Publishing a transaction event must never hang the payment-critical path waiting on a
        # down/unreachable Kafka - bounds the producer's metadata-fetch block (which happens
        # synchronously on the calling thread) to a few seconds instead of the client's 60s
        # default. See TransactionEventPublisher's Javadoc for the full best-effort-delivery
        # tradeoff this is part of.
        max.block.ms: 3000

switchyard:
  tcp:
    enabled: true
    port: 8583
